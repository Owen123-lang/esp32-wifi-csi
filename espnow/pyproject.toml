[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espnow-csi-pilot"
version = "0.1.0"
description = "Three-board ESP32-S3 CSI acquisition and quality checks"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[project.optional-dependencies]
serial = ["pyserial==3.5"]

[project.scripts]
espnow-csi = "csi_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
